paragraph=Talk to Siemens S7300/400/1200/1500 PLCs as a client, or answer HMIs, SCADA and other PLCs as an S7 server. The server owns no socket -- it is a transport-free protocol engine -- so it runs on any board and inside a cooperative scan loop. Fork of Dave Nardella's Settimino, which is Snap7 for Arduino.
